name: BikeStore CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8 SDK (Visual Studio 2022 compatible starter)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore BikeStore.sln
      - name: Build
        run: dotnet build BikeStore.sln --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test BikeStore.sln --configuration Release --no-build --verbosity normal
# Deployment is intentionally excluded from Stage 1; see docs/ROADMAP.md.
